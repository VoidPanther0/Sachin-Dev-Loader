name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild ImGuiTemplate.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /v:minimal

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "ImGuiTemplate.exe" |
            Select-Object -First 1
          if (-not $exe) { throw "ImGuiTemplate.exe was not produced by the build." }

          Copy-Item $exe.FullName (Join-Path $dist "ImGuiTemplate.exe") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "README.md") $dist -Force

          $hash = (Get-FileHash (Join-Path $dist "ImGuiTemplate.exe") -Algorithm SHA256).Hash
          "$hash  ImGuiTemplate.exe" | Out-File -FilePath (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii

          $refName = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $zip = Join-Path $dist "ImGuiTemplate-$refName-win64.zip"
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $zip -Force
          "Built $zip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImGuiTemplate-win64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
