name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:RELEASE_TAG.TrimStart("v")
          $header = Get-Content "src/app.h" -Raw
          if ($header -notmatch 'kVersion\[\]\s*=\s*"([^"]+)"') {
            throw "app::kVersion was not found in src/app.h."
          }
          $actual = $Matches[1]
          if ($actual -ne $expected) {
            throw "src/app.h says version $actual but the tag is $($env:RELEASE_TAG). Bump the version before tagging."
          }
          "Version $actual matches $($env:RELEASE_TAG)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Build Release x64
        run: msbuild ImGuiTemplate.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /v:minimal

      - name: Sign executable
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK." }

          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "ImGuiTemplate.exe" |
            Where-Object { $_.FullName -notlike "*\dist\*" } |
            Select-Object -First 1
          if (-not $exe) { throw "ImGuiTemplate.exe was not produced by the build." }

          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE." }

          & $signtool.FullName verify /pa /v $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE." }

          Remove-Item $pfx -Force

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "ImGuiTemplate.exe" |
            Select-Object -First 1
          if (-not $exe) { throw "ImGuiTemplate.exe was not produced by the build." }

          Copy-Item $exe.FullName (Join-Path $dist "ImGuiTemplate.exe") -Force

          $hash = (Get-FileHash (Join-Path $dist "ImGuiTemplate.exe") -Algorithm SHA256).Hash
          "$hash  ImGuiTemplate.exe" | Out-File -FilePath (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii

          "Built ImGuiTemplate.exe ($hash)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImGuiTemplate-win64
          path: |
            dist/ImGuiTemplate.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sachin Dev Loader ${{ github.ref_name }}
          body: |
            <img src="https://raw.githubusercontent.com/sapkotasachin064-beep/Sachin-Dev-Loader/main/src/Resources/Slogo.png" width="96" alt="Sachin Dev Loader">

            Windows x64 executable. Download `ImGuiTemplate.exe` and run it.
            Older builds update automatically; verify the file against the build artifact `SHA256SUMS.txt`.
          files: |
            dist/ImGuiTemplate.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish update to Supabase
        if: startsWith(github.ref, 'refs/tags/v') && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $sha = (Get-FileHash "dist/ImGuiTemplate.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $release = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/ImGuiTemplate.exe"

          $body = @{
            latest_version = $version
            update_url = $download
            update_sha256 = $sha
            release_url = $release
          } | ConvertTo-Json -Compress

          $headers = @{
            apikey = $env:SUPABASE_SERVICE_ROLE_KEY
            Authorization = "Bearer $($env:SUPABASE_SERVICE_ROLE_KEY)"
            Prefer = "return=minimal"
          }

          $uri = "$($env:SUPABASE_URL.TrimEnd('/'))/rest/v1/loader_config?id=eq.1"
          Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers `
            -ContentType "application/json" -Body $body | Out-Null

          "Published $version to Supabase ($sha)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Warn when Supabase publish secrets are missing
        if: startsWith(github.ref, 'refs/tags/v') && (env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '')
        shell: pwsh
        run: |
          "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not set. The release was built, but clients will not see the update until loader_config is updated."
